name: Update release snapshot

# Refreshes src/data/releases.json weekly and proposes the change as a pull
# request. Nothing is merged automatically.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/release-snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch release metadata
        # Fails without touching the file if any repository cannot be fetched or validated.
        run: npm run releases:update
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/data/releases.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff -- src/data/releases.json | grep -E '^[-+] +"(tag|name|size|digest|downloadUrl)"' > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only the check time changed; no pull request needed." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the new snapshot against download rules
        id: tests
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: npm test 2>&1 | tee test-output.txt
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/data/releases.json
          git commit -m "chore(data): update release snapshot"
          git push --force origin "$BRANCH"
          {
            echo "Automated refresh of \`src/data/releases.json\` from the GitHub Releases API."
            echo
            echo "Data tests: **$TEST_OUTCOME**. If they failed, a download rule no longer matches a published asset; update \`src/data/projects.ts\` on this branch."
            echo
            echo "Workflows do not run automatically on pull requests opened with GITHUB_TOKEN. Close and reopen this PR, or run CI manually, before merging."
          } > pr-body.md
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file pr-body.md
          elif ! gh pr create --head "$BRANCH" --base main --title "chore(data): update release snapshot" --body-file pr-body.md; then
            echo "Could not open a pull request (the repository may not allow Actions to create them). The branch $BRANCH was pushed; open the PR manually." >> "$GITHUB_STEP_SUMMARY"
          fi
