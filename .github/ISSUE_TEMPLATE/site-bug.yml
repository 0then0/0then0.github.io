name: Site bug
description: A broken page, link, layout or accessibility problem on the catalog site.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://0then0.github.io/projects/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device and settings
      placeholder: Firefox 150 on Windows 11, dark mode, 200% zoom
